schema_version: 5
product:
  name: FirmwareSight
  descriptor: Embedded Firmware Release Workbench
  tagline: "Know exactly what ships."
  cli: fwsight
  baseline_version: 0.6.0
  date: 2026-09-28
  status: P0_PASS_V0_DEFERRED_UNVALIDATED_G1_NOT_CLAIMED

principles:
  - evidence_first
  - deterministic_core
  - local_first
  - explicit_unknown
  - zero_workflow_migration
  - core_first_adapter_driven
  - four_product_verbs_only
  - stage_gated_delivery
  - candidate_not_commitment

users:
  primary:
    - firmware_engineer
    - firmware_lead
    - qa_compliance_reviewer
    - small_hardware_founder_team

validation:
  current_gate: G0_PASS_V0_DEFERRED_P0_PASS_G1_NOT_CLAIMED
  # P0 is closed. V0 is the only track that can be authorized next without a new governance prompt;
  # P1 stays out of this list because G1 still requires V0_PASS, which is 0/8 and unbuyable by CI.
  next_authorizable_tracks:
    - V0_workflow_prototype_validation
  g1_requires: [V0_PASS, P0_PASS]
  g1_claimed: false
  product_mvp_phases: [P1_analyzer, P2_compare, P3_gate, P4_bundle]
  own_artifact_validation: V1

post_mvp_candidates:
  namespaces: [E1, E2, E3, GX]
  active: false
  registry: 06_DELIVERY/07_POST_MVP_CANDIDATE_ROADMAP.md

architecture:
  principle: "Core-first, Adapter-driven, Product-specific Shell"
  core:
    language: Rust
    rust_version: "1.98.1"
    edition: "2024"
    library_crate_budget_phase0: 4
  desktop:
    shell: Tauri 2
    frontend: React 19.3
    typescript: strict
    build: Vite 8
    node: "24 LTS"
    package_manager: "pnpm 12"
    ipc_type_generation: ts-rs
  storage:
    engine: SQLite
    binding: rusqlite
    bundled: true
  parsing:
    object: true
    gimli: optional
    map_adapters: fixture_gated
    full_buffer_default_limit_mib: 512
  provenance:
    git_cli: true
    missing_git: UNKNOWN
  report:
    current: [JSON, self_contained_HTML]
    future_candidates: [CSV, Markdown]
    interview_gated: [XLSX, DOCX]
    native_pdf: rejected
  network:
    mvp: none
  gpu:
    mvp: none

gate:
  finding_states: [PASS, REVIEW, BLOCK, UNKNOWN, N/A]
  effective_severity: [PASS, REVIEW, BLOCK]

design:
  tokens_version: "0.2.0"
  accepted_ui_png_count: 7
  theme: light_only_mvp
  authority: "governance > frozen_assets_and_adrs > DESIGN.md > accepted_mockups > upstream_reference"

research:
  expert_round_resolution: 10_AUDIT/02_V0.5_EXPERT_REVIEW_RESOLUTION.md
  market_verification: 08_RESEARCH/09_EXPERT_ROUND_MARKET_VERIFICATION_2026-09-27.md
  disputed_claims_must_not_be_promoted: true

# P0 is closed at v0.6.0 by the architect-signed promotion prompt. There is no active task, and
# AGENTS.md 1 forbids any agent from inventing one: the next authorized track is V0 (needs real
# participants), and P1 needs its own sequencing decision because G1 still requires V0_PASS.
active_task: NONE


# Execution record of the V0 prompt's own scope. `p0_authorized: false` describes what the V0
# workflow-prototype prompt authorized; P0 was authorized separately, see `p0_execution` below.
v0_execution:
  authorized: true
  prompt: FirmwareSight_V0_Workflow_Prototype_Validation_PROMPT_v1.1.txt
  prototype_complete: true
  protocol_complete: true
  internal_functional_dry_run: passed
  external_participants_completed: 0
  external_participants_minimum: 8
  external_participants_target: "12-15"
  status: INCOMPLETE_INSUFFICIENT_EXTERNAL_SAMPLE
  p0_authorized: false

# V0 is deferred as a non-blocking research track. Deferred is not passed: the 0 / 8
# external-sample fact above stays in force and ADR-0020 still gates P1 on both V0 and P0.
v0_track:
  disposition: DEFERRED_NOT_YET_EVIDENCE_VALIDATED
  blocks_p0_engineering: false

p0_execution:
  authorized: true
  prompt: FirmwareSight_P0_Technical_Vertical_Slice_EXECUTION_PROMPT_v1.1_ARCHITECT_REVIEWED.txt
  prompt_sha256: 60a59196708a53592be4d828a0c1275cf74b3bfad0bdc6455f863ab38d32929b
  provenance: P0_TECHNICAL_VALIDATION/P0_EXECUTION_PROVENANCE.md
  start_local_head: e086e9880e00900e305a3cd88b4d899f73aa5711
  start_remote_head: e086e9880e00900e305a3cd88b4d899f73aa5711
  # The tree the delivered gate result belongs to. The commit that records this field is its child
  # and changes documentation only; see P0_EXECUTION_PROVENANCE.md "Final validated HEAD".
  final_validated_head: 65cb2dc
  commits_to_validated_tree: 6
  # Three remote runs, all read with `gh run view`. Run #1 failed four jobs, Run #2 failed one, and
  # Run #3 on the round-2 HEAD is green across all seven. What remains is the architect's promotion
  # sign-off, which is a governance act and not an engineering gap; nothing here writes P0 PASS.
  remote_state: "pushed as 1cd6309; Remote CI Run #3 executed and concluded success (7 of 7 jobs)"
  # PASS now: the engineering evidence was already measured in Runs #3 and #4, and the missing
  # element was the architect's signature, which this promotion prompt supplies.
  status: PASS
  evidence_status: PASS
  promotion_signed_by: "FirmwareSight P0 Final Promotion / v0.6.0 Baseline Closure v1.0 - Architect Signed"
  remediation_state: CLOSED_PROMOTED
  # The two HEADs answer different questions and are recorded separately on purpose: the first is
  # where the technical claim was validated, the second is what the architect read before signing.
  engineering_validated_head: 1cd6309a09313a0a900a83cb12e054e1a3d7c5e3
  engineering_validation_run: 36399805005
  engineering_validation_result: success
  engineering_validation_jobs: 7/7
  architect_reviewed_head: 5e58f778aad35f33188b96d0b8873401a31ccc3c
  architect_review_run: 36402637251
  architect_review_run_result: success
  architect_review_jobs: 7/7
  promotion_commit_contains: "baseline, governance, audit, P0 evidence reports, integrity manifest and directory tree only - no production source"
  remote_state: "promoted at 5e58f77; Runs #3 (1cd6309) and #4 (5e58f77) both success 7 of 7; the promotion commit is documentation and integrity only"
  remediation_prompt: FirmwareSight P0 CI Closure / Cross-Platform Reproducibility Remediation v1.0 (Architect Reviewed, supplied inline)
  run_2_closure_prompt: "FirmwareSight P0 Remote CI Run #2 Final Drift Closure v1.0 (Architect Reviewed, supplied inline)"
  remediation:
    # Fixes live in the local commit range that starts after this base head; the range is named by
    # the delivered report, because the commit that records the range is itself inside it.
    base_head: f9b8ccb
    round_1_confirmed_remotely:
      - fixture text policy, so a checkout cannot change committed evidence bytes
      - Ubuntu Rust Tauri system prerequisites, with clippy coverage kept
      - pixel-based desktop icon drift check, passing on Linux
      - cargo-deny policy executing with all four categories ok
      - macOS core smoke job, green on its first execution
      - both frontend matrix jobs
    round_1_found_locally:
      - storage evidence key: Build 1-N Evidence required migration 0002, schema version 2
      - the desktop window opened and driven on the shipping configuration
    round_2_remaining_defect: Generated output drift - the drift job compiles firmwaresight-desktop to regenerate ts-rs bindings but had no Linux prerequisites step
    round_2_fix: "the apt block Run #2 already proved on the rust job, copied into the drift job; 21 added lines in .github/workflows/p0-check.yml and no other file"
    remote_rerun: RUN_3_REQUIRED_AFTER_USER_PUSH
    ci_pass_claim_written_by_coding_agent: false
    local_gate: 14/14 default steps with 0 skipped mandatory steps, plus 3/3 under --only core-smoke
    desktop_smoke: PASS carried forward; round 2 changes no runtime source, so the window was not reopened for noise
    schema_version_after_remediation: 2
    # The architect's risk acceptance, recorded rather than inferred.
    advisory_disposition: ACCEPTED_AS_EXPLICIT_P0_TRANSITIVE_RISK_NOT_A_PROMOTION_BLOCKER
    architecture_conflicts:
      - RUSTSEC-2024-0429 glib 0.18.5 unsound: reached through the gtk-rs 0.18 line Tauri 2.12.0 requires; cargo update -p glib --precise 0.20.0 fails against gtk = "^0.18"; accepted with five revisit triggers, and no ADR because this round changes no architecture choice
      - RUSTSEC-2024-0370 proc-macro-error 1.0.4 unmaintained: host-only build dependency behind the same pin; the advisory itself states no safe upgrade exists; accepted on the same basis
  # Four runs, in order, none rewritten. Two failures are the reason the two successes exist.
  remote_ci_runs:
    - "Run #1 36360310447 on f9b8ccb: failure - Rust windows, Rust ubuntu, Generated output drift, Dependency policy red; Desktop UI both green (2 of 6)"
    - "Run #2 36378384225 on ebda52d: failure - 6 of 7 green, only Generated output drift red (Ubuntu provisioning in a second job)"
    - "Run #3 36399805005 on 1cd6309: success - 7 of 7 green. Engineering closure."
    - "Run #4 36402637251 on 5e58f77: success - 7 of 7 green. Pre-promotion revalidation of the governance-only successor."
  last_remote_ci:
    run_id: 36402637251
    head: 5e58f778aad35f33188b96d0b8873401a31ccc3c
    event: push
    conclusion: success
    passed_jobs: ["Rust (windows-latest)", "Rust (ubuntu-latest)", "Desktop UI (windows-latest)", "Desktop UI (ubuntu-latest)", "Generated output drift", "Dependency policy", "macOS Core Smoke"]
    failed_jobs: []
    read_with: gh run view 36399805005 --repo 2023violet/FirmwareSight --json databaseId,headSha,conclusion,jobs
    note: "Rust (windows-latest) reports one skipped step: the apt block guarded by if matrix.os == ubuntu-latest. The job itself is success."
    log: P0_TECHNICAL_VALIDATION/P0_CI_REPORT.md
  previous_remote_ci:
    run_id: 36378384225
    head: ebda52d63f22ff9f25786c1d80e53f5193cff183
    event: push
    conclusion: failure
    passed_jobs: ["Desktop UI (windows-latest)", "Rust (windows-latest)", "macOS Core Smoke", "Dependency policy", "Desktop UI (ubuntu-latest)", "Rust (ubuntu-latest)"]
    failed_jobs: ["Generated output drift"]
    retained_as: historical failure evidence in P0_CI_REPORT.md and P0_CI_RUN_2_CLOSURE_REPORT.md
  first_remote_ci:
    run_id: 36360310447
    head: f9b8ccba7d9326ac397675602beb3a7e9c3bcd02
    event: push
    conclusion: failure
    passed_jobs: ["Desktop UI (windows-latest)", "Desktop UI (ubuntu-latest)"]
    failed_jobs: ["Rust (windows-latest)", "Rust (ubuntu-latest)", "Generated output drift", "Dependency policy"]
    retained_as: historical failure evidence, not relabeled or removed
  closed: 2026-09-28
  allowed_final_statuses: [PASS, CONDITIONAL_PASS, FAIL, BLOCKED]
  library_crate_budget: 4
  library_crates_built: 4
  gate_command: python scripts/check.py
  gate_result: "local 14/14 with 0 skipped mandatory steps, plus 3/3 --only core-smoke; remote 7/7 jobs green on both 1cd6309 (Run #3) and 5e58f77 (Run #4)"
  tests: { rust: 104, ui: 19 }
  # Every promotion condition is met and cited; none was satisfied by wording.
  promotion_conditions:
    - "Remote CI green on the remediation HEAD - MET by Run #3 (36399805005) on 1cd6309: 7 of 7 jobs success"
    - "Architect review of the pre-promotion HEAD - MET by Run #4 (36402637251) on 5e58f77: 7 of 7 jobs success"
    - "Architect promotion sign-off - MET by this signed prompt; the scope of the signature is P0 only"
  promotion_scope_limits:
    - "The signature covers P0 only: V0, G1, P1, P2, P3 and P4 are not signed"
    - "G1 remains NOT CLAIMED: 06_DELIVERY/06_STAGE_GATES.md requires V0_PASS + P0_PASS and V0 is 0/8"
    - "ADR-0020 is unmodified; entering P1 while V0 is deferred would need its own sequencing prompt"
    - "No GitHub Release, installer, signing, notarization or updater work: this is a project baseline promotion, not a product release"
    - "No tag was created: git tag -l is empty in this repository, so there is no baseline-tag convention to follow and none was invented"
  # Answered by Run #2 on the real runners. Kept visible so a later reader does not re-ask them,
  # and listed per job rather than as a single "CI improved" claim.
  satisfied_conditions:
    - "cargo-deny remote PASS, advisories / bans / licenses / sources all ok"
    - desktop real-window smoke PASS (P0_DESKTOP_SMOKE_REPORT.md)
    - Rust (windows-latest) remote PASS, 104 tests
    - Rust (ubuntu-latest) remote PASS, 104 tests with firmwaresight-desktop compiling
    - Desktop UI (windows-latest) remote PASS
    - Desktop UI (ubuntu-latest) remote PASS, 19 UI tests
    - macOS Core Smoke remote PASS, 87 tests, first execution of the job
    - Generated output drift: design tokens and desktop icons remote PASS, including on Linux
    - "Remote CI Run #3 on 1cd6309: workflow overall success, 7 of 7 jobs, the drift job green after installing the same proven prerequisites"
  # Recorded separately because the P0 prompt accepted an unmeasured number with a stated reason.
  # This is a measurement gap, not a promotion blocker.
  non_blocking_measurement_gaps:
    - peak RSS is NOT MEASURED; reason and the measurements that do exist are in P0_PERFORMANCE_REPORT.md
  push_authorized: true_by_owner_instruction
  push_performed_by: "repository owner; the coding side pushed 1cd6309 on the owner's explicit instruction (git push origin main, no force)"
  remote_state_changed: true # origin/main == 1cd6309, local and remote in sync
  baseline_version_after_p0: 0.6.0
  v0_6_0_released: true
  v0_6_0_meaning: "P0 Technical Foundation Baseline - the vertical slice chain is validated. Not product MVP, not G1, not user value, not a stable commercial release."
  v0_6_0_does_not_claim: [V0_PASS, G1_PASS, product_mvp_complete, P1_authorized, compare_gate_bundle_complete, commercial_stable_release, installer_signing_updater_ready, user_value_validated, willingness_to_pay_validated, zero_vulnerabilities, CRA_compliance]
  p1_authorized: false
  g1_claimed_by_p0_pass: false
