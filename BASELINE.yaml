schema_version: 5
product:
  name: FirmwareSight
  descriptor: Embedded Firmware Release Workbench
  tagline: "Know exactly what ships."
  cli: fwsight
  baseline_version: 0.6.0
  date: 2026-09-28
  status: P0_PASS_G1_PASS_ON_P0_BASIS_UNDER_ADR_0026_P1_PASS_P2_PASS_P3_PASS_P4_PASS_G2_PASS_MVP_CANDIDATE_P5_PASS_COMPLETE_V0_NON_BLOCKING

principles:
  - evidence_first
  - deterministic_core
  - local_first
  - explicit_unknown
  - zero_workflow_migration
  - core_first_adapter_driven
  - four_product_verbs_only
  - stage_gated_delivery
  - candidate_not_commitment

users:
  primary:
    - firmware_engineer
    - firmware_lead
    - qa_compliance_reviewer
    - small_hardware_founder_team

validation:
  current_gate: G0_PASS_P0_PASS_G1_PASS_ON_P0_BASIS_P1_PASS_P2_PASS_P3_PASS_P4_PASS_G2_PASS_MVP_CANDIDATE_P5_PASS_COMPLETE_V0_NON_BLOCKING
  # ADR-0026 (2026-09-29) re-based G1 on P0 PASS for open-source MVP delivery and made V0 a
  # non-blocking feedback track. Before that date this file read g1_requires: [V0_PASS, P0_PASS] with
  # g1_claimed: false, and the historical records say so; the gate content of G1 itself (the verified
  # chain, fixture reproducibility, parser behaviour, non-blocking UI, a data model that can carry
  # Compare and Gate) is unchanged.
  next_authorizable_tracks:
    # P4 ran from 2026-09-30 under its own architect prompt and closed PASS / COMPLETE on 2026-10-01,
    # so the MVP product line is complete. The G2 closure audit that followed closed PASS the same day,
    # so the MVP engineering candidate is complete. The tracks the stage map names next are V1
    # own-artifact / real-user validation and P5 productization; neither is authorized by this file,
    # no authority file puts one before the other, and each needs its own architect decision. No B1, RC1 or GA1 work, no History page, installer, signing, updater, SBOM,
    # cloud, account, telemetry, AI or pricing exists or is implied by what is listed here.
    # P5 later arrived the legitimate way - its own architect prompt, delivered as a file and archived -
    # ran from 2026-10-03, and Commit F3 closed it PASS_COMPLETE on 2026-10-06, so its entry is no longer
    # a track that can be authorized; it is history, and p5_execution records it. It was removed from this
    # list rather than left to mislead the next reader into thinking P5 is still the thing to start.
    # The same rule now applies to V1: its own architect prompt arrived on 2026-10-06, the pointer names it,
    # and v1_execution records what it is doing. Listing it here as a track still awaiting authorization would
    # be describing a state that no longer exists, so it was removed - not because V1 is finished (it has run
    # zero sessions) but because it is the live task rather than a candidate for a future one.
    - V0_workflow_prototype_validation_as_non_blocking_feedback
  g1_requires: [P0_PASS]
  g1_basis_changed_by: 09_ADR/ADR-0026-open-source-mvp-first-delivery.md
  g1_claimed: true
  g1_claimed_basis: "P0 PASS at v0.6.0, measured green cross-platform through remote Run #12; claimed under ADR-0026, not under the earlier V0+P0 formula"
  product_mvp_phases: [P1_analyzer, P2_compare, P3_gate, P4_bundle]
  p1_status: PASS
  # The P2 prompt's own §5 requires this field to read IN_PROGRESS while the round runs, and to become
  # PASS_COMPLETE only from the item-by-item US-002 verdict in P2_VALIDATION/P2_COMPARE_EXIT_CHECKLIST.md.
  # That verdict exists: every §61 box is settled by a named test, a command or a line of a smoke report.
  # One sub-item stays open and is written there rather than folded away - desktop smoke step 27 was not
  # observable in the shipped window, so it is PARTIAL and covered only by tests.
  p2_status: PASS_COMPLETE
  # The same rule the P2 round followed: this field reads IN_PROGRESS while the round runs and becomes
  # PASS_COMPLETE only from the item-by-item US-003 verdict in P3_VALIDATION/P3_GATE_EXIT_CHECKLIST.md.
  # That verdict exists: forty boxes, each settled by a gh query, a command, a named test or a line of a
  # smoke report. One sub-item stays PARTIAL and is written there rather than folded away - the prior-run
  # re-read was never observed through the window, because the Release page has no run-id input.
  # P3's commits were unpushed when that verdict was written and were pushed after it: origin/main is
  # 219178af, where Run 36774472141 concluded failure on 6 of 7 jobs green - only Dependency policy, over
  # a crate yanked on crates.io the day of closure, and now moved off in Cargo.lock. The pack's numbers
  # stay locally measured; p3_execution.ci_coverage carries what the remote said.
  p3_status: PASS_COMPLETE
  # The same rule again, from the P4 prompt §5: this field read IN_PROGRESS while the round ran and
  # became PASS_COMPLETE only from the item-by-item US-004 verdict in
  # P4_VALIDATION/P4_BUNDLE_EXIT_CHECKLIST.md - sixty-one boxes, each settled by a command, a named
  # test or a numbered smoke step - with G2 written as READY_FOR_ENGINEERING_GATE_REVIEW and never as
  # PASS. That verdict exists as of 2026-10-01, so the field moves; the MVP product line is complete
  # and the pointer in .ai/ACTIVE_TASK.md returns to NONE. P4 closed on 2026-10-01. G2 itself has been
  # neither audited nor passed: READY_FOR_ENGINEERING_GATE_REVIEW is a statement that the audit may now
  # be opened, not a judgement of whole-MVP coherence, and only an architect prompt opens it.
  p4_status: PASS_COMPLETE
  # The G2 engineering closure audit ran under its own prompt on 2026-10-01. This field read
  # LOCAL_PASS_REMOTE_PENDING in the evidence commit f75cbc5 and becomes PASS here, in the one successor
  # the prompt allows, after f75cbc5's own Run 36948719972 came back 7 of 7 on its first attempt.
  # Verdict source: G2_VALIDATION/G2_EXIT_CHECKLIST.md. PASS means Product MVP ENGINEERING COMPLETE,
  # state MVP CANDIDATE - not production-ready, beta, RC or GA.
  g2_status: PASS
  own_artifact_validation: V1
  # Registered historically by ADR-0025. The slice it names is complete; the sequencing rule that made
  # V0 Batch A a precondition for the next slice no longer holds - ADR-0026 supersedes it.
  pre_g1:
    identifier: P1_A0
    registered_by: 09_ADR/ADR-0025-conditional-pre-g1-analyze-implementation.md
    is_stage_gate: false
    closes_p1: false
    sequencing_superseded_by: 09_ADR/ADR-0026-open-source-mvp-first-delivery.md

post_mvp_candidates:
  namespaces: [E1, E2, E3, GX]
  active: false
  registry: 06_DELIVERY/07_POST_MVP_CANDIDATE_ROADMAP.md

architecture:
  principle: "Core-first, Adapter-driven, Product-specific Shell"
  core:
    language: Rust
    rust_version: "1.98.1"
    edition: "2024"
    library_crate_budget_phase0: 4
  desktop:
    shell: Tauri 2
    frontend: React 19.3
    typescript: strict
    build: Vite 8
    node: "24 LTS"
    package_manager: "pnpm 12"
    ipc_type_generation: ts-rs
  storage:
    engine: SQLite
    binding: rusqlite
    bundled: true
  parsing:
    object: true
    gimli: optional
    map_adapters: fixture_gated
    full_buffer_default_limit_mib: 512
  provenance:
    git_cli: true
    missing_git: UNKNOWN
  report:
    current: [JSON, self_contained_HTML]
    future_candidates: [CSV, Markdown]
    interview_gated: [XLSX, DOCX]
    native_pdf: rejected
  network:
    mvp: none
  gpu:
    mvp: none

gate:
  finding_states: [PASS, REVIEW, BLOCK, UNKNOWN, N/A]
  effective_severity: [PASS, REVIEW, BLOCK]

design:
  tokens_version: "0.2.1"
  accepted_ui_png_count: 7
  theme: light_only_mvp
  authority: "governance > frozen_assets_and_adrs > DESIGN.md > accepted_mockups > upstream_reference"

research:
  expert_round_resolution: 10_AUDIT/02_V0.5_EXPERT_REVIEW_RESOLUTION.md
  market_verification: 08_RESEARCH/09_EXPERT_ROUND_MARKET_VERIFICATION_2026-09-27.md
  disputed_claims_must_not_be_promoted: true

# P0 is closed at v0.6.0, G1 is claimed on the P0 basis under ADR-0026, and P1 Analyze is PASS /
# COMPLETE: bounded Sections, Symbols and Evidence details, top contributors, the Evidence Inspector and
# the US-001 bytes/KiB presentation switch shipped in that round.
# What the paragraph above recorded as *authorizable but not begun* changed on 2026-09-29: the
# architect issued "FirmwareSight — P2 Compare MVP Implementation, Execution Prompt v1.0 — Architect
# Reviewed", so P2 Compare is now the live task. AGENTS.md 1 still binds: this pointer names one stage,
# and nothing beyond it. When this round closes, `active_task` returns to NONE and P3 becomes the next
# authorizable stage only — P3 still needs its own prompt.
# That round closed on 2026-09-29. Compare ships: Core owns every diff semantic, `fwsight diff` and the
# desktop Compare page render the same portable document, and the measurements are in
# P2_VALIDATION/P2_COMPARE_EXIT_CHECKLIST.md. So the pointer above returns to what it predicted:
# NONE. P3 Release Gate is the next authorizable stage and is NOT authorized by this file — it needs
# its own architect prompt, and no Gate rule, Release Bundle, History, Settings page, installer,
# signing, updater, SBOM, cloud, account, telemetry, AI, pricing or commercial work exists yet.
# P3 then arrived, the same way P2 did: the architect issued "FirmwareSight — P3 Release Gate MVP
# Implementation, Execution Prompt v1.1 — Architect Reviewed" on 2026-09-29, so the pointer moves again and
# nothing else moves with it. AGENTS.md 1 still binds - one named stage, no inference from the roadmap.
# ADR-0027 is this round's architecture decision: a fifth first-party crate, `firmwaresight-project`, holds
# project config, release-notes evidence, the read-only system Git adapter and the deterministic
# fingerprints, while Core keeps every Gate semantic and keeps its zero-dependency property.
# That round closed on 2026-09-30, so the pointer returns to what it predicted: NONE. The Gate runs -
# `firmwaresight.toml` read by the adapter, ten rules judged in Core, an immutable run and an immutable
# review acceptance persisted in SQLite, `fwsight gate` and the desktop Release page - with the item-by-item
# US-003 verdict in P3_VALIDATION/P3_GATE_EXIT_CHECKLIST.md. P4 Release Bundle is the next authorizable
# stage and is NOT authorized by this file: it needs its own architect prompt, and no bundle directory,
# `release prepare`, manifest generation, bundle checksums, History page, Settings page, installer,
# signing, updater, SBOM, cloud, account, telemetry, AI, pricing or commercial work exists yet.
# That prompt then arrived, the way the P2 and P3 prompts did: the architect issued
# "FirmwareSight - P4 Release Bundle MVP Implementation, Execution Prompt v1.0 - Architect Reviewed",
# delivered as a file and archived with its SHA-256 in 10_AUDIT/SOURCE_PROMPTS/, so the pointer moves and
# nothing else moves with it. AGENTS.md 1 still binds - one named stage, no inference from the roadmap -
# and P4's own §78 closes with STOP AFTER P4. What P4 may not do is declare the MVP finished: its only
# permitted gate statement is G2 = READY_FOR_ENGINEERING_GATE_REVIEW, because the architect runs the
# whole-MVP G2 closure audit in a round of its own.
# That round closed PASS / COMPLETE on 2026-10-01, item by item against US-004 in
# P4_VALIDATION/P4_BUNDLE_EXIT_CHECKLIST.md, so the pointer returns to what it predicted: NONE. The next
# authorizable act is the G2 engineering closure audit, and no file in this repository authorizes it -
# it starts only when the architect issues its prompt. G2 stays READY_FOR_ENGINEERING_GATE_REVIEW, never
# PASS, until that audit has run. This value agrees with .ai/ACTIVE_TASK.md, .ai/CURRENT_STATE.md and
# .ai/HANDOFF.md; it was left at P4_RELEASE_BUNDLE by the closure commits and aligned by the P4 Governance
# Baseline Consistency Closure prompt, which changed governance text only.
# The architect then issued "FirmwareSight - G2 Product MVP Engineering Closure Audit, Execution Prompt
# v1.0 - Architect Reviewed" (delivered as a file, archived with its SHA-256) and, inline, its Storage
# Path Semantics Clarification Addendum v1.0, so the pointer names that audit. It is an audit round, not a
# product stage: no new feature, verb, schema major, migration, dependency, crate or token. Its local
# verdict was G2 LOCAL PASS / READY FOR REMOTE CLOSURE (G2_VALIDATION/G2_EXIT_CHECKLIST.md), written in
# the evidence commit f75cbc5. That commit's own Run 36948719972 came back 7 of 7 on its first attempt,
# so the one successor commit the prompt allows (section 43) records it, sets G2 = PASS - Product MVP
# ENGINEERING COMPLETE, state MVP CANDIDATE - and returns the pointer to NONE. The G2 prompt says stop
# after G2: V1, P5 and anything later need a separate architect decision, and no file here authorizes one.
# The architect then issued "FirmwareSight - P5 Productization, Execution Prompt v1.0", delivered as a file
# and archived with its SHA-256 in 10_AUDIT/SOURCE_PROMPTS/, so the pointer moves and nothing else moves
# with it. AGENTS.md 1 still binds - one named stage, no inference from the roadmap. P5's own section 4 put
# a productization audit before any product code, and that audit is written:
# P5_VALIDATION/P5_PRODUCTIZATION_AUDIT.md answers section 4 A-H from commands run on this tree, and the
# owner's checkpoint on 2026-10-03 answered the four questions the audit reserved for the owner - artifact
# versions unify on 0.6.0 with the workspace version as the single source (baseline_version stays 0.6.0,
# no tag, no GitHub Release), migration 0005 follows a written P5_MIGRATION_DECISION.md and never precedes
# it, the package matrix is Windows with real install evidence on this host plus macOS and Ubuntu as
# CI_BUILD_ONLY, and the shipped store keeps the name firmwaresight-p0.sqlite with its path made visible
# instead of moved. One question is not this round's to answer: section 54 leaves the licence with the
# owner, so OPEN_SOURCE_LICENSE_DECISION_PENDING_OWNER_CONFIRMATION stands unchanged. The other one has been
# answered: section 32 sent the release-identity-versus-line-endings finding (L22) to the Architect as
# P5_VALIDATION/P5_RELEASE_IDENTITY_ADR_DRAFT.md followed by a STOP, and it came back decided as
# 09_ADR/ADR-0028-release-identity-bytes-as-evidence.md, Accepted - release identity uses the exact bytes
# observed on disk, require_clean_git = false stays valid with its caveat written down, .gitattributes is
# recommended for the user's repository and this repository does not edit its own, and the premise test in
# crates/firmwaresight-project/tests/bundle_builder.rs is named there as one that may not be removed or
# weakened. The draft is re-statused EXECUTION_RECORD rather than rewritten. Stage P5 ran from that opening
# to 2026-10-06, when Commit F3 - the only head its own prompt reserved the closure sentence for - re-audited
# every exit criterion and wrote P5 = PASS_COMPLETE: the section 5 prohibition was on writing a verdict
# before closure evidence existed, and the evidence is P5_VALIDATION/ plus two installed-acceptance rounds on
# CI-built artifacts. What F3 did NOT write: BETA, RC, GA, Production Ready, security clean, a tag, a GitHub
# Release, a published installer, a signature, a notarization, an updater or a licence. V1 own-artifact /
# real-user validation still has no prompt and stays unauthorized.
# That last sentence was true when it was written and stopped being true on the same day it was overtaken: the
# architect issued FirmwareSight - V1 Own-artifact External Validation, Execution Prompt v1.0 on 2026-10-06,
# delivered as a file and archived with its measured digest in 10_AUDIT/SOURCE_PROMPTS/, so the pointer moves
# and nothing else moves with it. The sentence above is kept as the record of what F3 knew rather than rewritten,
# because F3's closure round was correct at its own head: no file in that tree authorized V1. v1_execution below
# is the opening record; P5 stays PASS_COMPLETE and the product stays MVP_CANDIDATE, and AGENTS.md 1 still binds
# - one named stage, and V1 authorizes no B1, beta, RC, GA, licence, signing, notarization, updater or feature.
# That pointer moved again on 2026-10-07, the same way it moved off P5's `NONE`: the architect issued a new
# prompt and the owner activated the track it names. `u1_execution` below is its opening record. V1 is PAUSED,
# not closed - `stage_status` stays IN_PROGRESS, `research_state` stays RECRUITMENT_READY, the eligible-session
# count stays 0, the cohort build stays the frozen F3 artifact, and nothing in V1's own block is rewritten by
# this round. Pausing a research track is not a verdict on it: `v1_execution.paused_for` is the only field that
# changes, and the human recruitment work it describes is still the operator's whenever the track resumes.
# U1 is a UI productization track and authorizes no product stage: not G3, not B1 Private Beta, not RC, not GA,
# not signing, notarization, an updater, a licence, pricing or cloud. AGENTS.md 1 still binds - one named stage.
active_task: U1_UI_PRODUCTIZATION_CONVERGENCE


# Execution record of the V0 prompt's own scope. `p0_authorized: false` describes what the V0
# workflow-prototype prompt authorized; P0 was authorized separately, see `p0_execution` below.
v0_execution:
  authorized: true
  prompt: FirmwareSight_V0_Workflow_Prototype_Validation_PROMPT_v1.1.txt
  prototype_complete: true
  protocol_complete: true
  internal_functional_dry_run: passed
  external_participants_completed: 0
  external_participants_minimum: 8
  external_participants_target: "12-15"
  status: INCOMPLETE_INSUFFICIENT_EXTERNAL_SAMPLE
  external_validation_state: ACTIVE_WAITING_FOR_REAL_PARTICIPANTS
  batch_a_target: "0 / 4-5 eligible external sessions completed"
  p0_authorized: false
  # Registered by the V0 Batch A activation prompt. It changes which task is live, not any count: the
  # eligible-session numbers above stay at zero until real participants exist, and this round wrote none.
  batch_a_activation:
    activated_by: "FirmwareSight V0 Batch A External Validation Activation & Interim Review Execution Prompt v1.0 - Architect Reviewed"
    activated_on: "2026-09-29"
    replaces_active_task: P1A0_REAL_ARTIFACT_INTAKE
    prompt_is_research_only: true
    product_code_writable: false
    formal_instrument: V0_VALIDATION/prototype/
    prototype_version: v0.1.0
    formal_task_source: V0_VALIDATION/protocol/TASK_SCRIPT.md
    session_template: V0_VALIDATION/sessions/TEMPLATE.md
    first_invocation_state: "NO_REAL_PARTICIPANT_EVIDENCE - activation, recruitment-pack verification and stale-version wording only; no count incremented, no session written"
    forbidden_evidence: [synthetic_participant, ai_persona, fabricated_quote, fabricated_task_outcome, fabricated_timing, fabricated_willingness_to_pay, fabricated_n_or_N, ineligible_participant_counted_into_formal_n]
    p1_a0_production_desktop_used_for_formal_tasks: false
    research_price_anchor_state: "no concrete anchor is decided; BATCH_A_RESEARCH_PRICE_ANCHORS.md says so and this round invented none"
    open_owner_input: "recruitment of real participants, and 2-3 exploratory price anchors if the Product Lead wants them"
    stop_condition: "4-5 eligible external sessions plus the Batch A interim review, then back to the architect"
    # Same-day supersession of the sequencing above: ADR-0026 moved V0 off the critical path. The
    # activation itself happened and its evidence state is real - zero sessions, nothing fabricated.
    sequencing_superseded_on: "2026-09-29 by 09_ADR/ADR-0026-open-source-mvp-first-delivery.md; the price-anchor prompt that would have followed was withdrawn before execution"

# V0's own sample state is unchanged and honest: 0 of 8 eligible external sessions, because no real
# participant has been met and the coding side authors none. What changed on 2026-09-29 is its position on
# the critical path - ADR-0026 makes it a feedback track rather than a gate, so a zero count no longer
# blocks any P-stage or the G1 claim. The instrument stays frozen and reusable.
v0_track:
  disposition: NON_BLOCKING_USER_FEEDBACK_TRACK
  sample_state: "0 / 8 eligible external sessions, unchanged and not fabricated"
  blocks_p0_engineering: false
  blocks_pre_g1_slices_after_p1_a0: false
  blocks_p1_p2_p3_p4: false
  blocks_g1: false
  instrument_remains_frozen: "V0_VALIDATION/prototype/ at v0.1.0 with protocol/TASK_SCRIPT.md, so a later feedback round is still comparable"

# The pre-G1 slice that was authorized and is now complete, recorded here rather than in `p0_execution`
# because it is not P0. Registered by ADR-0025, which supersedes one ADR-0020 clause and nothing else.
# `p0_execution` below keeps its frozen verdict - `status: PASS`, the promotion records and the
# remediation history are not re-opened; what later rounds added there are the remote runs they
# measured, so the file holds one current remote fact per chain rather than two competing ones. What
# this comment asserted when it was written - that the live task after `ace6fbe` and `3b59585` was the
# research track above - has since been superseded twice: ADR-0026 re-sequenced V0 as a non-blocking
# track on 2026-09-29, the P1 Analyze round ran under its own prompt the same day, and `active_task`
# below now reads P2_COMPARE, because the architect issued the P2 prompt the same day. The sentence stays
# as dated history; `active_task` is the live field.
pre_g1_execution:
  authorized: true
  slice: P1A0_REAL_ARTIFACT_INTAKE
  adr: 09_ADR/ADR-0025-conditional-pre-g1-analyze-implementation.md
  parent_prompt: "FirmwareSight Pre-G1 Sequencing Revision + P1-A0 Real Artifact Intake v1.0 (Architect Reviewed, supplied inline)"
  addendum_prompt: "FirmwareSight P1-A0 Design Contract Closure Addendum v1.0 (Architect Reviewed, supplied inline)"
  supersedes: "the ADR-0020 clause P1 Product MVP implementation 只有两者都 PASS 后开始"
  scope: "real artifact intake through a native dialog, optional GNU ld MAP, reuse of the validated Analyze summary"
  stop_condition: P1_A0_ONLY
  p1_stage_status: NOT_PASS_NOT_CLOSED # as recorded for this slice; P1's current status is in p1_execution below
  p1_a1_authorized: false # true as at 2026-09-28; ADR-0026 moved the sequencing rule, see next_engineering_gate below
  p2_authorized: false
  p3_authorized: false
  p4_authorized: false
  # Historical record of what ADR-0025 required, kept because P1-A0 was implemented under exactly these
  # terms. ADR-0026 (2026-09-29) removed the first two bullets as a precondition and re-based G1, so the
  # live authorization sequence now reads P1 -> P2 -> P3 -> P4, each still needing its own prompt.
  sequencing_superseded_on: "2026-09-29 by 09_ADR/ADR-0026-open-source-mvp-first-delivery.md"
  next_engineering_gate:
    - "V0 Batch A at least 4 eligible external sessions with real participants"
    - "interim architect review of that evidence"
    - "a new architect prompt for each additional pre-G1 slice"
  creates_new_baseline: false
  baseline_version_stays: 0.6.0
  g1_claimed: false # the claim made on 2026-09-29 is recorded in validation.g1_claimed and p1_execution below
  design_tokens_version_bump_authorized_by_addendum: "0.2.0 -> 0.2.1 (border.width.hairline only)"
  implemented: true # 2026-09-29. Pushed by the owner as 2960173 and measured green on push; see correctness_closure below.
  evidence: P1_A0_VALIDATION/
  tests_after_p1_a0: { rust: 142, ui: 31 } # whole-workspace counts on this tree after the correctness-closure round; p0_execution.tests keeps P0's own closure measurement
  correctness_closure:
    authorized_by: "FirmwareSight P1-A0 Evidence Identity & Persistence Correctness Closure Execution Prompt v1.0 (Architect Reviewed, supplied inline)"
    is_new_slice: false # it closes defects inside P1-A0; it authorizes nothing beyond it
    gate_run_id: 36499759371
    gate_run_head: 29601735a2eff2c9e3677ef1dfa88cf752484694
    gate_run_conclusion: success
    gate_run_jobs: 7/7
    adr_required: false # 00_GOVERNANCE/03_DECISION_POLICY.md lists "Bug 修复" as not needing one, and no new domain or storage semantic was introduced
    fixed:
      - "a supplied GNU ld MAP is sealed as the build's second artifact, so the optional MAP component SnapshotId::compose already defined is finally exercised"
      - "ELF-only and ELF+MAP persist as two distinct immutable builds, and each dedupes against its own repeats"
      - "BuildSummary selects the build's index-0 artifact explicitly instead of accepting whichever artifact row SQLite happens to visit first"
      - "memory evidence names the source its own accounting basis supports, so an ELF analyzed with no MAP no longer claims map provenance"
      - "the redundant and semantically wrong EvidenceSummaryDto.from_map is removed, with no replacement boolean"
    not_changed:
      - NORMALIZATION_VERSION, which stays p0-normalize-1
      - SCHEMA_VERSION, which stays 2, and the migration list, which stays 0001 and 0002
      - the public portable schema, the dependency set and the capability set
      - "P1-A1, P2, P3 and P4 authorization, V0 participation and the G1 claim"
    goldens_changed: [golden/cli/p0-basic-analyze.json, golden/cli/p0-dual-region-analyze.json]
    evidence: P1_A0_VALIDATION/P1_A0_CORRECTNESS_SMOKE_REPORT.md
    this_commit_remote_ci: "36515470263 on ace6fbe - completed, success, 7 of 7 jobs. Prompt §23's anti-recursion rule held at write time: the closure commit carried no run of its own, because none existed yet. This line is that run's successor record, added after the owner pushed, and reads with gh run view 36515470263 --repo 2023violet/FirmwareSight"

# P1 Analyze, the first MVP stage under ADR-0026. The parent prompt authorizes the slice; its acceptance
# addendum narrows what "complete" means by binding P1 PASS to the frozen US-001 criteria.
p1_execution:
  authorized: true
