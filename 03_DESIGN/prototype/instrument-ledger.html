<meta charset="utf-8">
<title>FirmwareSight Instrument Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: desktop workbench — TopBar 40 / Rail 224 (56 collapsed) / SubjectBar 44 / Workspace / Inspector 340.
   Every value below is a FirmwareSight design token (assets/design-tokens.json v0.3.0) or a v0.4.0 addition
   proposed by ADR-0034 (marked "v0.4"). Nothing here is invented outside that set. */
:root {
  /* colour roles — light (tokens v0.3.0; diff.removed uses the v0.4 value #C7372C) */
  --bg-canvas:#F7F8FA; --bg-surface:#FFFFFF; --bg-subtle:#F1F3F5;
  --text:#171A1F; --text-2:#5D6673; --text-dis:#98A2B3; --on-accent:#FFFFFF;
  --border:#D9DEE5;
  --accent:#2563EB; --accent-hover:#1D4ED8; --accent-press:#1E40AF;
  --pass:#18794E; --review:#9A6700; --review-strong:#7A5200; --block:#C9372C; --unknown:#667085;
  --added:#18794E; --added-bg:#E7F3EC; --removed:#C7372C; --removed-bg:#FBECEA; --changed:#2563EB; --changed-bg:#E9F0FD;
  --c1:#DCE7FB; --c2:#B8CDF7; --c3:#84A9F3; --c4:#4F7BE8; --c5:#1D4ED8; --c-other:#F1F3F5;
  --scrim:rgba(23,26,31,0.32);
  --shadow-sm:0 1px 2px rgba(23,26,31,0.08),0 4px 10px rgba(23,26,31,0.06);
  --shadow-lg:0 8px 24px rgba(23,26,31,0.12),0 2px 6px rgba(23,26,31,0.08);
  /* spacing / radius / motion */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px; --s12:48px;
  --r-control:6px; --r-panel:8px; --r-modal:10px; --r-pill:999px;
  --m-micro:120ms; --m-std:150ms; --m-panel:180ms; --ease:cubic-bezier(0,0,0.2,1);
  /* type — system stacks only (ADR-0018 D3); figure 28/36 and weights are v0.4 */
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,Arial,"Microsoft YaHei UI",sans-serif;
  --font-mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --fs-meta:12px; --lh-meta:18px; --fs-body:13px; --lh-body:20px; --fs-section:15px; --lh-section:22px;
  --fs-page:20px; --lh-page:28px; --fs-figure:28px; --lh-figure:36px; --w-regular:400; --w-semi:600;
  /* layout — v0.4 shell sizes */
  --rail:224px; --rail-c:56px; --topbar:40px; --subject:44px; --inspector:340px;
  --row:36px; --row-c:28px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg-canvas:#15171B; --bg-surface:#1E2126; --bg-subtle:#262B32;
  --text:#E9ECEF; --text-2:#A9B1BC; --text-dis:#737B87; --on-accent:#0C1424; --border:#3A414B;
  --accent:#6BA1F5; --accent-hover:#8AB8F8; --accent-press:#5590EE;
  --pass:#4CC38A; --review:#E3B341; --review-strong:#F2C55C; --block:#F2705F; --unknown:#98A2B3;
  --added:#4CC38A; --added-bg:#16341F; --removed:#F2705F; --removed-bg:#3A1A15; --changed:#6BA1F5; --changed-bg:#16294A;
  --c1:#1C2B45; --c2:#26406B; --c3:#345C99; --c4:#4F7BE8; --c5:#84A9F3; --c-other:#3A414B;
  --scrim:rgba(0,0,0,0.5); color-scheme:dark; } }
:root[data-theme="dark"] {
  --bg-canvas:#15171B; --bg-surface:#1E2126; --bg-subtle:#262B32;
  --text:#E9ECEF; --text-2:#A9B1BC; --text-dis:#737B87; --on-accent:#0C1424; --border:#3A414B;
  --accent:#6BA1F5; --accent-hover:#8AB8F8; --accent-press:#5590EE;
  --pass:#4CC38A; --review:#E3B341; --review-strong:#F2C55C; --block:#F2705F; --unknown:#98A2B3;
  --added:#4CC38A; --added-bg:#16341F; --removed:#F2705F; --removed-bg:#3A1A15; --changed:#6BA1F5; --changed-bg:#16294A;
  --c1:#1C2B45; --c2:#26406B; --c3:#345C99; --c4:#4F7BE8; --c5:#84A9F3; --c-other:#3A414B;
  --scrim:rgba(0,0,0,0.5); color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg-canvas);color:var(--text);font:var(--w-regular) var(--fs-body)/var(--lh-body) var(--font-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:var(--s4)}
button,input,select{font:inherit;color:inherit}
.mono,code,kbd{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:var(--fs-page);line-height:var(--lh-page);font-weight:var(--w-semi)}
h2{font-size:var(--fs-section);line-height:var(--lh-section);font-weight:var(--w-semi)}
h3{font-size:var(--fs-body);line-height:var(--lh-body);font-weight:var(--w-semi)}
p{margin:0}
.meta{font-size:var(--fs-meta);line-height:var(--lh-meta);color:var(--text-2)}
.icon{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.icon.md{width:20px;height:20px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---- review toolbar (not part of the product) ---- */
.review{max-width:1440px;margin:0 auto var(--s3);display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);align-items:center;font-size:var(--fs-meta);color:var(--text-2)}
.review b{color:var(--text);font-weight:var(--w-semi)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-control);overflow:hidden;background:var(--bg-surface)}
.seg button{border:0;background:transparent;padding:2px var(--s2);cursor:pointer;color:var(--text-2);min-height:24px}
.seg button[aria-pressed="true"]{background:var(--bg-subtle);color:var(--text);font-weight:var(--w-semi)}
.seg button+button{border-left:1px solid var(--border)}

/* ---- the app frame ---- */
.app{max-width:1440px;height:min(900px,calc(100vh - 80px));min-height:640px;margin:0 auto;background:var(--bg-canvas);border:1px solid var(--border);border-radius:var(--r-panel);overflow:hidden;
  display:grid;grid-template-columns:var(--rail) minmax(0,1fr) auto;grid-template-rows:var(--topbar) var(--subject) minmax(0,1fr);
  grid-template-areas:"top top top" "rail subject subject" "rail main insp"}
.app.rail-collapsed{grid-template-columns:var(--rail-c) minmax(0,1fr) auto}
.topbar{grid-area:top;display:flex;align-items:center;gap:var(--s4);padding:0 var(--s4);background:var(--bg-surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:var(--s2);font-weight:var(--w-semi)}
.brand .mark{width:20px;height:20px;border-radius:var(--r-control);background:var(--text);display:grid;place-items:center}
.brand .mark svg{stroke:var(--bg-surface)}
.project{display:flex;align-items:center;gap:var(--s1);border:1px solid var(--border);border-radius:var(--r-control);padding:2px var(--s2);background:var(--bg-surface);cursor:pointer}
.localnote{color:var(--text-2);font-size:var(--fs-meta);display:flex;gap:var(--s1);align-items:center}
.cmdk{margin-left:auto;display:flex;align-items:center;gap:var(--s2);border:1px solid var(--border);border-radius:var(--r-control);padding:3px var(--s2);background:var(--bg-canvas);color:var(--text-2);cursor:pointer;min-width:200px}
kbd{font-size:11px;border:1px solid var(--border);border-radius:4px;padding:0 4px;background:var(--bg-surface);color:var(--text-2)}
.cmdk kbd{margin-left:auto}

.rail{grid-area:rail;background:var(--bg-surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:var(--s3) var(--s2);gap:var(--s1);min-width:0}
.rail .group{font-size:var(--fs-meta);color:var(--text-2);padding:var(--s2) var(--s2) var(--s1);letter-spacing:.02em}
.navbtn{display:flex;align-items:center;gap:var(--s3);width:100%;border:0;background:transparent;border-radius:var(--r-control);padding:6px var(--s2);cursor:pointer;color:var(--text-2);text-align:left;min-height:32px;position:relative}
.navbtn:hover{background:var(--bg-subtle);color:var(--text)}
.navbtn[aria-current="page"]{background:var(--bg-subtle);color:var(--text);font-weight:var(--w-semi)}
.navbtn[aria-current="page"]::before{content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--accent)}
.rail .spacer{flex:1}
.collapse{color:var(--text-2)}
.rail-collapsed .navbtn span,.rail-collapsed .rail .group{display:none}
.rail-collapsed .navbtn{justify-content:center}

.subject{grid-area:subject;display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4);background:var(--bg-surface);border-bottom:1px solid var(--border);min-width:0;overflow-x:auto;white-space:nowrap}
.subj-build{display:flex;align-items:center;gap:var(--s2);min-width:0}
.subj-label{font-size:var(--fs-meta);color:var(--text-2)}
.chip{display:inline-flex;align-items:center;gap:var(--s1);font-size:var(--fs-meta);line-height:var(--lh-meta);padding:1px var(--s2);border-radius:var(--r-pill);border:1px solid var(--border);color:var(--text-2);background:var(--bg-surface)}
.chip.ok{color:var(--pass)} .chip.unk{color:var(--unknown);border-style:dashed}
.chip.stale{color:var(--review-strong);border-color:var(--review)}
.subject .push{margin-left:auto;display:flex;gap:var(--s2)}

main{grid-area:main;overflow:auto;min-width:0;background:var(--bg-canvas)}
.page{padding:var(--s6) var(--s8) var(--s12);display:flex;flex-direction:column;gap:var(--s6);max-width:1120px}
.page-head{display:flex;align-items:flex-start;gap:var(--s4);flex-wrap:wrap}
.page-head .actions{margin-left:auto;display:flex;gap:var(--s2);flex-wrap:wrap}

/* LeadAnswer — the one figure per page */
.lead{display:flex;flex-direction:column;gap:var(--s2);padding-bottom:var(--s6);border-bottom:1px solid var(--border)}
.lead-row{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap}
.figure{font:var(--w-semi) var(--fs-figure)/var(--lh-figure) var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.lead-sentence{font-size:var(--fs-section);line-height:var(--lh-section);color:var(--text)}
.lead-ref{color:var(--text-2)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:var(--s2);border:1px solid var(--border);background:var(--bg-surface);border-radius:var(--r-control);padding:5px var(--s3);cursor:pointer;min-height:32px;white-space:nowrap}
.btn:hover{background:var(--bg-subtle)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:var(--w-semi)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--bg-subtle)}
.btn.sm{min-height:24px;padding:1px var(--s2);font-size:var(--fs-meta)}
.btn[disabled]{color:var(--text-dis);cursor:not-allowed;background:var(--bg-subtle)}

/* tabs */
.tabs{display:flex;gap:var(--s1);border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden}
.tab{border:0;background:transparent;padding:var(--s2) var(--s3);cursor:pointer;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent);font-weight:var(--w-semi)}
.tab .count{font-family:var(--font-mono);font-size:var(--fs-meta);color:var(--text-2);margin-left:var(--s1)}

/* state badges */
.st{display:inline-flex;align-items:center;gap:var(--s1);font-weight:var(--w-semi);white-space:nowrap}
.st.pass{color:var(--pass)} .st.review{color:var(--review-strong)} .st.block{color:var(--block)} .st.unknown{color:var(--unknown)} .st.na{color:var(--text-2)}
.st.zero{color:var(--text-2);font-weight:var(--w-regular)}
.st .n{font-family:var(--font-mono);font-weight:var(--w-regular);color:var(--text-2)}

/* FactValue — a number you can trace */
.fact{border:0;background:transparent;padding:0 2px;margin:0 -2px;border-radius:4px;cursor:pointer;font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:inherit;display:inline-flex;align-items:center;gap:6px;text-align:inherit}
.fact:hover{background:var(--bg-subtle)}
.fact .ev{width:7px;height:7px;border-radius:50%;flex:none;border:1.5px solid var(--text-2)}
.ev.observed{background:var(--text-2)} .ev.derived{background:var(--bg-surface);box-shadow:inset 3.5px 0 0 var(--text-2)}
.ev.declared{background:transparent} .ev.unknown{border-style:dashed;border-color:var(--unknown)}
.fact.selected{background:var(--changed-bg)}

/* DeltaValue — neutral, glyph-carried */
.delta{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.delta .g{color:var(--text-2);margin-right:2px}
.absent{color:var(--text-2);font-family:var(--font-ui)}

/* surfaces & tables */
.section{display:flex;flex-direction:column;gap:var(--s3)}
.section-head{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap}
.section-head .meta{margin-left:auto}
.surface{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-panel)}
.tablewrap{overflow-x:auto;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-panel)}
table{border-collapse:collapse;width:100%;min-width:560px}
caption{text-align:left;padding:var(--s2) var(--s3);font-size:var(--fs-meta);color:var(--text-2);border-bottom:1px solid var(--border)}
th,td{padding:0 var(--s3);height:var(--row);text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:var(--fs-meta);font-weight:var(--w-semi);color:var(--text-2);background:var(--bg-surface);position:sticky;top:0;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--bg-subtle)}
td.num,th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
td.name{font-family:var(--font-mono)}
tr.row-added td:first-child{box-shadow:inset 3px 0 0 var(--added)}
tr.row-removed td:first-child{box-shadow:inset 3px 0 0 var(--removed)}
tr.row-changed td:first-child{box-shadow:inset 3px 0 0 var(--changed)}
.kind{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-meta);font-weight:var(--w-semi);padding:0 6px;border-radius:4px}
.kind.added{color:var(--added);background:var(--added-bg)} .kind.removed{color:var(--removed);background:var(--removed-bg)} .kind.changed{color:var(--changed);background:var(--changed-bg)}
.note{font-size:var(--fs-meta);color:var(--text-2);margin-left:var(--s2)}

.filterbar{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.filterbar input{border:1px solid var(--border);border-radius:var(--r-control);padding:4px var(--s2);background:var(--bg-surface);min-width:220px;min-height:32px}

/* bars (chart.blue only; status only from Gate) */
.bar{height:8px;background:var(--c-other);border-radius:2px;overflow:hidden;display:flex}
.bar>i{display:block;height:100%;background:var(--c4)}
.compo{display:flex;height:12px;border-radius:2px;overflow:hidden;background:var(--c-other);gap:1px}
.compo>i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3);font-size:var(--fs-meta);color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:var(--s1)}
.legend b{width:10px;height:10px;border-radius:2px;display:inline-block}

.meter-row{display:grid;grid-template-columns:120px minmax(0,1fr) auto;align-items:center;gap:var(--s3);padding:var(--s2) 0}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:var(--s1) var(--s4);align-items:baseline}
.kv dt{color:var(--text-2);font-size:var(--fs-meta)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:var(--s6)}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}

/* Notice */
.notice{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s1) var(--s3);padding:var(--s3) var(--s4);border:1px solid var(--border);border-radius:var(--r-panel);background:var(--bg-surface)}
.notice .icon{margin-top:2px}
.notice.unknown{border-style:dashed} .notice.unknown .icon{color:var(--unknown)}
.notice.stale{border-color:var(--review)} .notice.stale .icon{color:var(--review-strong)}
.notice.error{border-color:var(--block)} .notice.error .icon{color:var(--block)}
.notice.info .icon{color:var(--text-2)}
.notice dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px var(--s3);margin:var(--s1) 0 0;font-size:var(--fs-meta)}
.notice dt{color:var(--text-2)} .notice dd{margin:0}
.notice .acts{display:flex;gap:var(--s2);margin-top:var(--s2);flex-wrap:wrap}

/* Inspector */
.insp{grid-area:insp;width:var(--inspector);background:var(--bg-surface);border-left:1px solid var(--border);display:flex;flex-direction:column;min-width:0;overflow:auto}
.insp[hidden]{display:none}
.insp-head{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg-surface)}
.insp-head .x{margin-left:auto}
.insp-body{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s4)}
.insp .bigval{font:var(--w-semi) var(--fs-section)/var(--lh-section) var(--font-mono);overflow-wrap:anywhere}
.raw{font-family:var(--font-mono);font-size:var(--fs-meta);background:var(--bg-subtle);border-radius:var(--r-control);padding:var(--s2) var(--s3);overflow-wrap:anywhere;white-space:pre-wrap}

/* steps (Release setup) */
.steps{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--border);align-items:start}
.step:last-child{border-bottom:0}
.step .num{width:24px;height:24px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;font:var(--fs-meta) var(--font-mono);color:var(--text-2)}
.step.done .num{border-color:var(--pass);color:var(--pass)}
.setup-line{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);align-items:center;padding:var(--s2) var(--s3);background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-panel);font-size:var(--fs-meta);color:var(--text-2)}
.setup-line .btn{margin-left:auto}

.finding{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--s1) var(--s3);padding:var(--s3) var(--s4);border-bottom:1px solid var(--border);align-items:start}
.finding:last-child{border-bottom:0}
.finding .rule{font-family:var(--font-mono);font-weight:var(--w-semi)}
.group-head{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s4);background:var(--bg-subtle);border-bottom:1px solid var(--border);cursor:pointer;width:100%;border-left:0;border-right:0;border-top:0;text-align:left}
details.group>summary{list-style:none}
details.group>summary::-webkit-details-marker{display:none}

/* empty */
.empty{display:flex;flex-direction:column;gap:var(--s4);padding:var(--s8);border:1px dashed var(--border);border-radius:var(--r-panel);background:var(--bg-surface);align-items:flex-start}
.empty ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:var(--s2)}

/* command palette & sheet overlays */
.scrim{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:start center;padding-top:12vh;z-index:10}
.scrim[hidden]{display:none}
.palette{width:min(560px,92vw);background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-modal);box-shadow:var(--shadow-lg);overflow:hidden}
.palette input{width:100%;border:0;border-bottom:1px solid var(--border);padding:var(--s3) var(--s4);background:transparent;font-size:var(--fs-section)}
.palette input:focus{outline:none}
.palette ul{list-style:none;margin:0;padding:var(--s1);max-height:320px;overflow:auto}
.palette li{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3);border-radius:var(--r-control);cursor:pointer}
.palette li[aria-selected="true"]{background:var(--bg-subtle)}
.palette li .meta{margin-left:auto}

.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg-surface);padding:var(--s2) var(--s4);border-radius:var(--r-control);box-shadow:var(--shadow-sm);font-size:var(--fs-meta);z-index:20}
.toast[hidden]{display:none}

/* exports page */
.paper{background:#FFFFFF;color:#171A1F;border:1px solid #D9DEE5;border-radius:var(--r-panel);padding:var(--s8);max-width:794px;font-family:var(--font-ui)}
.paper table{min-width:0}
.paper th{color:#5D6673;background:#FFFFFF;border-bottom-color:#D9DEE5}
.paper td{border-bottom-color:#D9DEE5}
.paper tbody tr:hover td{background:transparent}
.paper .meta{color:#5D6673}
.paper .absent{color:#5D6673}
.paper .kind.added{color:#18794E;background:#E7F3EC}.paper .kind.removed{color:#C7372C;background:#FBECEA}.paper .kind.changed{color:#2563EB;background:#E9F0FD}
.paper .st.block{color:#C9372C}.paper .st.pass{color:#18794E}
.paper .delta .g{color:#5D6673}
.mast{display:flex;justify-content:space-between;gap:var(--s4);border-bottom:2px solid #171A1F;padding-bottom:var(--s2);margin-bottom:var(--s4);font-size:var(--fs-meta)}
.code{font-family:var(--font-mono);font-size:var(--fs-meta);line-height:var(--lh-meta);background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-panel);padding:var(--s4);overflow-x:auto;white-space:pre;margin:0}
.svgbox{background:#FFFFFF;border:1px solid var(--border);border-radius:var(--r-panel);overflow:hidden}
.svgbox svg{display:block;width:100%;height:auto}

/* components page */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s2)}
.sw{border:1px solid var(--border);border-radius:var(--r-panel);overflow:hidden;background:var(--bg-surface);font-size:var(--fs-meta)}
.sw i{display:block;height:36px}
.sw div{padding:var(--s1) var(--s2)}
.iconset{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:var(--s2)}
.iconset div{display:flex;align-items:center;gap:var(--s2);padding:var(--s2);border:1px solid var(--border);border-radius:var(--r-control);background:var(--bg-surface);font-size:var(--fs-meta)}

/* responsive: the prototype shell also reflows to phone width */
@media (max-width:1279px){ .insp{position:fixed;top:0;right:0;bottom:0;z-index:9;box-shadow:var(--shadow-sm);width:min(var(--inspector),92vw)} }
@media (max-width:1179px){ .app:not(.rail-open){grid-template-columns:var(--rail-c) minmax(0,1fr) auto} .app:not(.rail-open) .navbtn span,.app:not(.rail-open) .rail .group{display:none} .app:not(.rail-open) .navbtn{justify-content:center} }
@media (max-width:700px){
  .app{height:auto;min-height:0;grid-template-columns:minmax(0,1fr)!important;grid-template-rows:auto auto auto auto;grid-template-areas:"top" "rail" "subject" "main"}
  .rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border);padding:var(--s1)}
  .rail .group,.rail .spacer,.collapse{display:none!important}
  .navbtn{width:auto;flex:none}
  .navbtn span{display:inline!important}
  .navbtn[aria-current="page"]::before{display:none}
  .localnote,.cmdk span{display:none} .cmdk{min-width:0}
  .page{padding:var(--s4)}
  main{overflow:visible}
}

let factSeq = 0; const FACTS = {};
function fact(text, info, cls = 'observed') {
  const id = 'f' + (++factSeq); FACTS[id] = { text, cls, ...info };
  const sel = S.insp && S.insp.text === text && S.insp.field === info.field ? ' selected' : '';
  return `<button class="fact${sel}" data-fact="${id}" aria-label="${esc(text)}, ${cls}">${esc(text)}<span class="ev ${cls}" aria-hidden="true"></span></button>`;
}
function delta(d) {
  if (d == null) return `<span class="absent">—</span>`;

  return `<span class="delta"><span class="g">${d > 0 ? '▲' : '▼'}</span>${Math.abs(d).toLocaleString('en-US')}</span>`;
}
