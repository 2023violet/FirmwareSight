name: P0 verification gate

# Every step in the seven gate jobs below is the same `scripts/check.py` a developer runs, so CI
# cannot be green while the local gate is red, or the other way round. The three package jobs do
# something the gate deliberately does not: they build an installer. They still call into check.py
# (`--only package`) rather than carrying their own command list, for the same reason.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # rust-toolchain.toml pins 1.98.1 with rustfmt and clippy, so no toolchain step is needed
      # here; rustup honours the file before the first cargo invocation.
      # Node is required because `clippy --all-features` compiles the desktop crate in its
      # shipping configuration, whose codegen embeds apps/desktop/ui/dist/ - a directory a fresh
      # checkout does not have. scripts/check.py builds it when it is missing.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable the pinned pnpm
        run: corepack enable
      # Run 36360310447 failed `clippy --all-features` on ubuntu-latest inside glib-sys' build
      # script: `pkg-config cannot find glib-2.0`. That is runner provisioning, not a source
      # defect - the same crate graph compiles on Windows, and the Ubuntu UI job was green. The
      # list and its reasoning now live in .github/actions/linux-tauri-prereqs, which this job,
      # `drift` and `package-ubuntu` all use: prompt section 41 adds a third job that compiles the
      # shell, which is what turned two deliberate copies into a maintenance problem.
      - name: Install Linux prerequisites for the Tauri shell
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/linux-tauri-prereqs
      - name: Verification gate (fmt, clippy, test)
        run: python scripts/check.py --only rust

  frontend:
    name: Desktop UI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Corepack provides the exact pnpm that wrote pnpm-lock.yaml; a global pnpm of another
      # major would resolve a different tree and prove nothing about this one.
      - name: Enable the pinned pnpm
        run: corepack enable
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verification gate (install, typecheck, lint, test, build)
        run: python scripts/check.py --only frontend

  drift:
    name: Generated output drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install script dependencies
        run: python -m pip install -r scripts/requirements.txt
      # The same prerequisites the `rust` job installs, and for the same reason: the drift gate
      # regenerates the ts-rs bindings by running `cargo test -p firmwaresight-desktop`, which links
      # the GTK stack. Run #2 (36378384225) proved it - `drift/desktop icons` passed and
      # `drift/ipc bindings` died in gobject-sys' build script with
      # `Package gobject-2.0 was not found in the pkg-config search path`.
      - name: Install Linux prerequisites for the Tauri shell
        uses: ./.github/actions/linux-tauri-prereqs
      # Regenerates tokens.css, the desktop icons and the ts-rs bindings, then requires that the
      # committed files did not move. `git diff --exit-code` is the assertion.
      - name: Verification gate (drift)
        run: python scripts/check.py --only drift

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny
        run: cargo install cargo-deny@0.20.2 --locked
      - name: Verification gate (deny)
        run: python scripts/check.py --only deny

  # 05_ENGINEERING/06_CI_CD_BASELINE.md requires a macOS core smoke on a push to main; the four
  # jobs above covered only Windows and Linux, so a fully green run of them still did not satisfy
  # the frozen baseline. Core, artifact, storage, report and the CLI are what Tier 2 macOS support
  # claims, and they need no WebView, so the desktop shell is excluded rather than the platform.
  # Cost control per the same matrix: pull requests may skip it, a manual dispatch runs it.
  macos-core:
    name: macOS Core Smoke
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verification gate (core smoke)
        run: python scripts/check.py --only core-smoke

  # ── P5 package jobs (prompt section 41) ────────────────────────────────────────────────
  #
  # The seven jobs above answer "is this tree correct". These three answer "can a stranger install
  # it", which the gate structurally cannot: an installer can only be built for the platform
  # standing in front of the runner, and `04_TECH/17` names NSIS for Windows, .app/.dmg for macOS
  # and .deb for Linux as the baseline's own targets. The frozen CI matrix said packaging belongs
  # to a nightly or a release tag; P5 moves it onto a push to main for the length of this stage,
  # and that change is recorded in `04_TECH/17` and `05_ENGINEERING/06` rather than left implicit.
  # Pull requests still do not package.
  #
  # Each job runs `python scripts/check.py --only package`, the same command a developer runs, and
  # uploads what it produced. Nothing here publishes a GitHub Release, creates a tag, signs a
  # binary or enables an updater: the artifacts land on the workflow run and stay unsigned, which
  # is the boundary P5 was given.

  package-windows:
    name: Package Windows
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable the pinned pnpm
        run: corepack enable
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The Tauri CLI is what makes `--features custom-protocol` the build's problem rather than the
      # user's (prompt section 8). Pinned exactly and installed `--locked`, the same way this
      # workflow installs cargo-deny, so the packaging tool is as reproducible as the crate graph.
      - name: Install the pinned Tauri CLI
        run: cargo install tauri-cli@2.12.1 --locked
      - name: Build and verify the Windows package
        run: python scripts/check.py --only package
      - name: Resolve the distribution name prefix
        id: dist
        shell: bash
        run: echo "prefix=$(python scripts/verify_package_artifacts.py --print-prefix)" >> "$GITHUB_OUTPUT"
      - name: Upload the artifact set
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dist.outputs.prefix }}
          path: target/dist-package/
          if-no-files-found: error
          retention-days: 14

  package-ubuntu:
    name: Package Ubuntu
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable the pinned pnpm
        run: corepack enable
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # This job builds the shell itself, so it needs the WebView stack the other Linux jobs need.
      - name: Install Linux prerequisites for the Tauri shell
        uses: ./.github/actions/linux-tauri-prereqs
      - name: Install the pinned Tauri CLI
        run: cargo install tauri-cli@2.12.1 --locked
      - name: Build and verify the Ubuntu package
        run: python scripts/check.py --only package
      - name: Resolve the distribution name prefix
        id: dist
        shell: bash
        run: echo "prefix=$(python scripts/verify_package_artifacts.py --print-prefix)" >> "$GITHUB_OUTPUT"
      - name: Upload the artifact set
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dist.outputs.prefix }}
          path: target/dist-package/
          if-no-files-found: error
          retention-days: 14

  package-macos:
    name: Package macOS
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable the pinned pnpm
        run: corepack enable
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the pinned Tauri CLI
        run: cargo install tauri-cli@2.12.1 --locked
      # Unsigned on purpose: no certificate, no notary profile, no signing identity. The run
      # produces a .app and the .dmg that wraps it and calls neither of them signed, which is the
      # `CI_BUILD_ONLY` evidence prompt section 40 allows - it is proof a package can be built, not
      # proof that anyone ran it.
      - name: Build and verify the macOS packages
        run: python scripts/check.py --only package
      - name: Resolve the distribution name prefix
        id: dist
        shell: bash
        run: echo "prefix=$(python scripts/verify_package_artifacts.py --print-prefix)" >> "$GITHUB_OUTPUT"
      - name: Upload the artifact set
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dist.outputs.prefix }}
          path: target/dist-package/
          if-no-files-found: error
          retention-days: 14
