# The P0 gate. Every step here is the same `scripts/check.py` a developer runs, so CI cannot be
# green while the local gate is red, or the other way round.
name: P0 verification gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # rust-toolchain.toml pins 1.98.1 with rustfmt and clippy, so no toolchain step is needed
      # here; rustup honours the file before the first cargo invocation.
      - name: Verification gate (fmt, clippy, test)
        run: python scripts/check.py --only rust

  frontend:
    name: Desktop UI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Corepack provides the exact pnpm that wrote pnpm-lock.yaml; a global pnpm of another
      # major would resolve a different tree and prove nothing about this one.
      - name: Enable the pinned pnpm
        run: corepack enable
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verification gate (install, typecheck, lint, test, build)
        run: python scripts/check.py --only frontend

  drift:
    name: Generated output drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install script dependencies
        run: python -m pip install -r scripts/requirements.txt
      # Regenerates tokens.css, the desktop icons and the ts-rs bindings, then requires that the
      # committed files did not move. `git diff --exit-code` is the assertion.
      - name: Verification gate (drift)
        run: python scripts/check.py --only drift

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny
        run: cargo install cargo-deny@0.20.2 --locked
      - name: Verification gate (deny)
        run: python scripts/check.py --only deny
