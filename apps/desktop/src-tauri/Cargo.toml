[package]
name = "firmwaresight-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Thin Tauri 2 shell exposing FirmwareSight core facts to the desktop UI."

# Upstream Tauri template's production switch. `tauri`'s build script sets `dev = !custom_protocol`
# (tauri-2.12.0/build.rs:253), and tauri-codegen embeds nothing when `dev` is true
# (tauri-codegen-2.7.0/src/context.rs:178). Without this feature a `--release` binary still loads the
# Vite dev server, so the embedded-frontend path is only real when it is enabled.
[features]
custom-protocol = ["tauri/custom-protocol"]

# Desktop only in P0, so a plain rlib is enough. The `staticlib`/`cdylib` forms the Tauri
# mobile template adds would arrive with an authorized mobile target, not before it.
[lib]
name = "firmwaresight_desktop"
crate-type = ["lib"]
path = "src/lib.rs"

[[bin]]
name = "firmwaresight-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
firmwaresight-artifact = { workspace = true }
firmwaresight-report = { workspace = true }
firmwaresight-storage = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.0", features = [] }
# TypeScript bindings are produced only from this Application-side module (ADR-0019); no Core,
# artifact, storage or report type derives TS.
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
