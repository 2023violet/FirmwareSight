# Provenance record for a committed P2 Compare fixture. Generated by scripts/gen_p2_fixtures.py.

fixture_id = "p2-diff-target"
purpose = "P2 Compare fixture pair, target side. Authored so that a build-to-build diff has one of each change kind to report: an unchanged section and symbol, a changed-size section and symbol, an address-only move, an added section and symbol, a removed section and symbol, and both memory budgets moving in a known direction with exact MAP-backed evidence."
license = "Written for this project; no third-party code copied"
generated_on = "2026-09-29"

[toolchain]
name = "arm-none-eabi-gcc"
version = "arm-none-eabi-gcc.EXE (Arm GNU Toolchain 14.3.Rel1 (Build arm-14.174)) 14.3.1 20250623"
linker = "GNU ld (Arm GNU Toolchain 14.3.Rel1 (Build arm-14.174)) 2.44.0.20250616"

[build]
command = '''arm-none-eabi-gcc -g -Os -mcpu=cortex-m4 -mthumb -c source/common.c -o build/common.o && arm-none-eabi-gcc -g -Os -mcpu=cortex-m4 -mthumb -c source/payload.c -o build/payload.o && arm-none-eabi-gcc -g -Os -mcpu=cortex-m4 -mthumb -nostdlib -nostartfiles -e main build/common.o build/payload.o -T firmware.ld -Wl,-Map=firmware.map -o firmware.elf'''
rebuild_script = "scripts/gen_p2_fixtures.py"

[expectations]
architecture = "ARM (cortex-m4, thumb, 32-bit little-endian)"
expected_capability = "ELF Supported; MAP Supported via gnu_ld adapter"
map_backed_evidence = "exact"
paired_with = "p2-diff-base"

[[known_limitations]]
description = "controlled linker script, not a vendor SDK default"

[[known_limitations]]
description = "no DWARF consumption: the debug sections are present but unread, as in P0"

[[known_limitations]]
description = "not a real customer firmware image"

[[known_limitations]]
description = "object and module attribution is absent on purpose, so Compare must report it unavailable"

