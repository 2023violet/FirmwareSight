# Provenance record for a committed P5 compatibility fixture.
# Generated by scripts/gen_p5_compat_fixtures.py. The bytes are tool output; this file names
# the tools that produced them, the layout facts readable from them, and what they are here to
# prove. The expected_* values below are arithmetic on readelf output and on this MAP's own
# region table, not on the analyzer's answer; the analyzer is held to them by
# crates/firmwaresight-artifact/tests/p5_compat_fixtures.rs.

fixture_id = "p5-extsram"
purpose = "Case C, external SRAM: a third writable region at 0x60000000 that the product can only know from the MAP region table, because no internal-RAM assumption reaches that address."
layout_case = "C"
license = "Written for this project; no third-party code copied"
generated_on = "2026-10-04"

[toolchain]
compiler = "arm-none-eabi-gcc"
compiler_version = "arm-none-eabi-gcc.EXE (Arm GNU Toolchain 14.3.Rel1 (Build arm-14.174)) 14.3.1 20250623"
compiler_in_artifact = """GCC: (Arm GNU Toolchain 14.3.Rel1 (Build arm-14.174)) 14.3.1 20250623"""
linker = """GNU ld (Arm GNU Toolchain 14.3.Rel1 (Build arm-14.174)) 2.44.0.20250616"""
linker_role = "final link and the memory map"

[build]
rebuild_script = "scripts/gen_p5_compat_fixtures.py"
relative_paths = "required: GNU ld copies the object paths it is given into the MAP"
commands = [
  """arm-none-eabi-gcc -mcpu=cortex-m4 -mthumb -g -Os -ffunction-sections -fdata-sections -c source/main.c -o build/main.o""",
  """arm-none-eabi-ld -e main -Textsram.ld build/main.o -o firmware.elf -Map=firmware.map""",
]

[expectations]
architecture = "ARM (cortex-m4, thumb, 32-bit little-endian)"

expected_product_evidence_basis = """map-memory-configuration+elf-load for every charged section: the region attribute the MAP declares plus the address the ELF carries, never the section name"""

expected_product_unknowns = """build id (no .note.gnu.build-id section is present); git context (analyze is given one artifact and no project); and what technology sits at 0x60000000 - the MAP declares an address range with attributes and nothing more"""

load_segments = """4"""

allocatable_sections = """.bss 0x20000004+0x4 ; .data 0x20000000+0x4 ; .extsram_pool 0x60000000+0x80 ; .rodata 0x08000014+0x20 ; .text 0x08000000+0x14"""

entry_point = """0x08000001"""

expected_image_bytes = """184 = 20 .text + 32 .rodata + 4 .data + 128 .extsram_pool"""

expected_live_ram_bytes = """136 = 4 .data + 128 .extsram_pool + 4 .bss"""

acceptance = """crates/firmwaresight-artifact/tests/p5_compat_fixtures.rs"""

[[known_limitations]]
description = """the address is conventional for an external bus, not tied to a specific part"""

[[known_limitations]]
description = """proves a declared region is accounted from real MAP evidence, not that every vendor map is covered"""

