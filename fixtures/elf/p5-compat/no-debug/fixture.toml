# Provenance record for a committed P5 compatibility fixture.
# Generated by scripts/gen_p5_compat_fixtures.py. The bytes are tool output; this file names
# the tools that produced them, the layout facts readable from them, and what they are here to
# prove. The expected_* values below are arithmetic on readelf output and on this MAP's own
# region table, not on the analyzer's answer; the analyzer is held to them by
# crates/firmwaresight-artifact/tests/p5_compat_fixtures.rs.

fixture_id = "p5-no-debug"
purpose = "Case G, two different absences kept apart: firmware-nodebug.elf was compiled without -g, firmware-stripped.elf was linked with debug and then had it removed by objcopy -S. They are not the same event and only the second one is a post-link strip."
layout_case = "G"
license = "Written for this project; no third-party code copied"
generated_on = "2026-10-04"

[toolchain]
compiler = "arm-none-eabi-gcc"
compiler_version = "arm-none-eabi-gcc.EXE (Arm GNU Toolchain 14.3.Rel1 (Build arm-14.174)) 14.3.1 20250623"
compiler_in_artifact = """GCC: (Arm GNU Toolchain 14.3.Rel1 (Build arm-14.174)) 14.3.1 20250623"""
linker = """GNU ld (Arm GNU Toolchain 14.3.Rel1 (Build arm-14.174)) 2.44.0.20250616"""
linker_role = "final link and the memory map"

[build]
rebuild_script = "scripts/gen_p5_compat_fixtures.py"
relative_paths = "required: GNU ld copies the object paths it is given into the MAP"
commands = [
  """arm-none-eabi-gcc -mcpu=cortex-m4 -mthumb -g -Os -c source/main.c -o build/with_debug.o""",
  """arm-none-eabi-ld -e main -Tplain.ld build/with_debug.o -o with-debug.elf""",
  """arm-none-eabi-objcopy -S with-debug.elf firmware-stripped.elf""",
  """arm-none-eabi-gcc -mcpu=cortex-m4 -mthumb -Os -c source/main.c -o build/main.o""",
  """arm-none-eabi-ld -e main -Tplain.ld build/main.o -o firmware-nodebug.elf -Map=firmware.map""",
]

[expectations]
architecture = "ARM (cortex-m4, thumb, 32-bit little-endian)"

expected_product_evidence_basis = """map-memory-configuration+elf-load for every charged section: the region attribute the MAP declares plus the address the ELF carries, never the section name"""

expected_product_unknowns = """build id (no .note.gnu.build-id section is present); git context; debug info, which is unavailable in both files; and for firmware-stripped.elf the symbol table, which is absent - an absence that must stay an absence rather than become zero named symbols"""

second_file_expectations = """firmware-stripped.elf carries the same layout, derived the same way: entry_point 0x08000001; image 48 = 12 .text + 32 .rodata + 4 .data; live_ram 8 = 4 .data + 4 .bss; load_segments 2"""

load_segments = """2"""

allocatable_sections = """.bss 0x20000004+0x4 ; .data 0x20000000+0x4 ; .rodata 0x0800000c+0x20 ; .text 0x08000000+0xc"""

entry_point = """0x08000001"""

expected_image_bytes = """48 = 12 .text + 32 .rodata + 4 .data"""

expected_live_ram_bytes = """8 = 4 .data + 4 .bss"""

acceptance = """crates/firmwaresight-artifact/tests/p5_compat_fixtures.rs"""

[[known_limitations]]
description = """measured, not assumed: on this binutils (2.44.0.20250616) `objcopy -S` removed the .debug_* sections and also .symtab and .strtab, so firmware-stripped.elf has no symbol table while firmware-nodebug.elf still does. The two files therefore differ in two ways, and a test that reads one as the other would be reading its own assumption"""

[[known_limitations]]
description = """the intermediate with-debug.elf was deliberately not committed, so nothing here implies a third claim about a third file"""

[[files]]
path = "build/main.o"

[[files]]
path = "build/with_debug.o"

[[files]]
path = "firmware-nodebug.elf"

[[files]]
path = "firmware-stripped.elf"

[[files]]
path = "firmware.map"

[[files]]
path = "plain.ld"

[[files]]
path = "source/main.c"
