# Provenance record for a committed P5 compatibility fixture.
# Generated by scripts/gen_p5_compat_fixtures.py. The bytes are tool output; this file names
# the tools that produced them, the layout facts readable from them, and what they are here to
# prove. The expected_* values below are arithmetic on readelf output and on this MAP's own
# region table, not on the analyzer's answer; the analyzer is held to them by
# crates/firmwaresight-artifact/tests/p5_compat_fixtures.rs.

fixture_id = "p5-clang-arm"
purpose = "The Clang half of the supported cohort: code produced by clang for an explicit Arm target and final-linked by GNU ld, so the ELF carries clang's own .comment while the MAP remains GNU ld output. The layout is the plain one on purpose, to keep the compiler the variable."
layout_case = "compiler"
license = "Written for this project; no third-party code copied"
generated_on = "2026-10-04"

[toolchain]
compiler = "clang"
compiler_version = "clang version 22.1.8 (https://github.com/llvm/llvm-project ca7933e47d3a3451d81e72ac174dcb5aa28b59d1)"
compiler_in_artifact = """clang version 22.1.8 (https://github.com/llvm/llvm-project ca7933e47d3a3451d81e72ac174dcb5aa28b59d1)"""
linker = """GNU ld (Arm GNU Toolchain 14.3.Rel1 (Build arm-14.174)) 2.44.0.20250616"""
linker_role = "final link and the memory map"

[build]
rebuild_script = "scripts/gen_p5_compat_fixtures.py"
relative_paths = "required: GNU ld copies the object paths it is given into the MAP"
commands = [
  """clang --target=arm-none-eabi -ffreestanding -fno-builtin -mcpu=cortex-m4 -mthumb -g -Os -ffunction-sections -fdata-sections -c source/main.c -o build/main.o""",
  """arm-none-eabi-ld -e main -Tplain.ld build/main.o -o firmware.elf -Map=firmware.map""",
]

[expectations]
architecture = "ARM (cortex-m4, thumb, 32-bit little-endian)"

expected_product_evidence_basis = """map-memory-configuration+elf-load for every charged section: the region attribute the MAP declares plus the address the ELF carries, never the section name"""

expected_product_unknowns = """build id (no .note.gnu.build-id section is present); git context; and the role of .ARM.exidx.text.main, which the parser still does not recognise - it is charged from region and load evidence, not from a name it knows"""

load_segments = """2"""

allocatable_sections = """.ARM.exidx.text.main 0x08000030+0x8 ; .bss 0x20000004+0x4 ; .data 0x20000000+0x4 ; .rodata 0x08000010+0x20 ; .text 0x08000000+0xe"""

entry_point = """0x08000001"""

expected_image_bytes = """58 = 14 .text + 32 .rodata + 8 .ARM.exidx.text.main + 4 .data"""

expected_live_ram_bytes = """8 = 4 .data + 4 .bss"""

acceptance = """crates/firmwaresight-artifact/tests/p5_compat_fixtures.rs"""

[[known_limitations]]
description = """proves clang-compiled Arm code at this target, this optimization level and with this linker"""

[[known_limitations]]
description = """not a survey of clang -mcpu values, not an Apple or Windows-target clang, and not an lld link"""

[[files]]
path = "build/main.o"

[[files]]
path = "firmware.elf"

[[files]]
path = "firmware.map"

[[files]]
path = "plain.ld"

[[files]]
path = "source/main.c"
