# Provenance record for a D4 armlink sample (06_DELIVERY/14). Not a support claim.
# Generated by scripts/gen_d4_armlink_fixtures.py; the AXF and MAP are tool output.

fixture_id = "d4-armlink-target"
purpose = "Same-origin ArmClang/armlink set for the D4 armlink adapter: AXF, MAP listing with sizes and totals, scatter file, sources and exact tool versions."
license = "Written for this project; no third-party code copied; --no_scanlib keeps the Arm C library out (an engineering note, not legal advice; the Owner confirms before any public release)"

[toolchain]
armclang = """Product: MDK Plus 5.43 Component: Arm Compiler for Embedded 6.24 Tool: armclang [5f371800] Target: unspecified-arm-none-none"""
armlink = """Product: MDK Plus 5.43 Component: Arm Compiler for Embedded 6.24 Tool: armlink [5f371500] For support see http://www.arm.com/support Software supplied by: ARM Limited"""

[build]
rebuild_script = "scripts/gen_d4_armlink_fixtures.py"
commands = [
  """armclang.exe --target=arm-arm-none-eabi -mcpu=cortex-m4 -mthumb -Os -ffunction-sections -fdata-sections -fcommon -c source/app/main.c -o build/app/main.o""",
  """armclang.exe --target=arm-arm-none-eabi -mcpu=cortex-m4 -mthumb -Os -ffunction-sections -fdata-sections -c source/app/sensors/imu.c -o build/app/sensors/imu.o""",
  """armclang.exe --target=arm-arm-none-eabi -mcpu=cortex-m4 -mthumb -Os -ffunction-sections -fdata-sections -c source/drv/uart.c -o build/drv/uart.o""",
  """armclang.exe --target=arm-arm-none-eabi -mcpu=cortex-m4 -mthumb -Os -ffunction-sections -fdata-sections -c source/drv/spi.c -o build/drv/spi.o""",
  """armar.exe --create build/libdrv.lib build/drv/uart.o build/drv/spi.o""",
  """armlink.exe --cpu=Cortex-M4 --scatter=objects.sct --entry=Reset_Handler --no_scanlib --remove --map --symbols --info=sizes,totals,unused --list=firmware.map build/app/main.o build/app/sensors/imu.o build/libdrv.lib(uart.o) build/libdrv.lib(spi.o) -o firmware.axf""",
]
